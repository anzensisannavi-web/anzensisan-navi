  <script>
    // ヘッダーのスクロール制御
    let lastScrollY = window.scrollY;
    const header = document.getElementById('site-header');

    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;

      if (currentScrollY < 10) {
        header.classList.remove('header-hidden');
      } else if (currentScrollY > lastScrollY && currentScrollY > 60) {
        header.classList.add('header-hidden');
      } else if (currentScrollY < lastScrollY) {
        header.classList.remove('header-hidden');
      }

      lastScrollY = currentScrollY;

    // 記事データベース
    const articles = {
      'payoff': {
        tag: '資産保護の基本',
        title: 'ペイオフ（預金保険制度）上限1000万円の注意点と資産の守り方',
        content: `
          <p>預金保険制度（通称：ペイオフ）とは、万が一金融機関が経営破たんした場合に、預金者の資産を保護するために作られた国の制度です。普段私たちが何気なく利用している銀行口座ですが、破たんリスクに備えたルールを正しく理解しておくことが重要です。</p>

          <h2>1. 保護される範囲と限度額は？</h2>
          <p>ペイオフが適用される場合、1つの金融機関につき、預金者1人あたり<strong>「元本1,000万円までとその利息」</strong>が保護されます。</p>
          <p>注意したいのは「1,000万円を超える部分」の扱いです。上限を超えた預金については、破たんした銀行の財産状況（回収できた貸付金など）に応じて支払われるため、一部または全部がカットされるリスクがあります。</p>

          <h2>2. ペイオフ対象となる預金・対象外の預金</h2>
          <p>銀行に預けているすべてのお金が同じように保護されるわけではありません。金融商品ごとの分類を把握しておきましょう。</p>
          <ul>
            <li><strong>全額保護されるもの：</strong> 決済用預金（当座預金や、無利息・要求払・決済サービスを提供する条件を満たす普通預金）</li>
            <li><strong>1,000万円＋利息まで保護されるもの：</strong> 一般的な定期預金、普通預金、通知預金、積立預金など</li>
            <li><strong>対象外となるもの：</strong> 外貨預金、譲渡性預金（CD）、投資信託、債券など</li>
          </ul>

          <div class="info-box">
            💡 <strong>名義別のカウントに注意：</strong><br>
            同じ銀行で「A支店」と「B支店」に口座を分かっていても、同一人物の名義であれば合算して1,000万円までしか保護されません。家族名義（夫・妻・子供）はそれぞれ別名義としてカウントされます。
          </div>

          <h2>3. 1,000万円を超える現金資産を守る実践的な対策</h2>
          <p>手元に1,000万円以上の現金資産がある場合、安全に管理するための具体的な方法は以下の3つです。</p>
          
          <p><strong>① 複数の金融機関に分散する</strong><br>
          最もシンプルな対策は、複数の銀行に口座を作り、それぞれ1,000万円未満に収まるよう資金を分散して預け入れる方法です。</p>

          <p><strong>② 個人向け国債を活用する</strong><br>
          国が発行する「個人向け国債」は、銀行のペイオフ枠とは別枠であり、発行元が国であるため元本保証の安全性が極めて高い商品です。購入限度額もなく、預金分散の手間を減らすことができます。</p>

          <p><strong>③ 決済用預金口座を開設する</strong><br>
          金利は付きませんが、無利息の「決済用預金」であれば1,000万円を超えても全額保護の対象となります。近々の事業資金や大きな決済用資金を一時的に置いておく場合に適しています。</p>

          <h2>まとめ</h2>
          <p>銀行の破たんは滅多に起きないものの、万が一の事態から大切な資産を守るには、日頃から「1銀行1,000万円まで」を目安に管理しておくことが安心につながります。</p>
        `
      },
      'bonds': {
        tag: '国債の基本',
        title: '個人向け国債「変動10年」と「固定5年」の選び方',
        content: `
          <p>国が発行する「個人向け国債」は、元本割れのリスクがなく、1万円から購入できる最も安全な運用先のひとつです。自分に合ったタイプを正しく選ぶためのポイントを解説します。</p>

          <h2>1. 個人向け国債の3つの基本タイプ</h2>
          <p>個人向け国債には、満期と金利タイプの違いによって主に3つの種類があります。</p>
          <p>それぞれの特徴を押さえておきましょう。</p>
          <ul>
            <li><strong>変動10年（変動金利型）：</strong> 半年ごとに適用金利が見直されるタイプ。金利が上昇する局面でも、世の中の金利に合わせて受け取れる利息が増えていくのが特徴です。</li>
            <li><strong>固定5年（固定金利型）：</strong> 発行時の金利が満期まで変わらないタイプ。金利上昇の波には乗りませんが、確実に決まった利息を受け取りたい場合に適しています。</li>
            <li><strong>固定3年（固定金利型）：</strong> 満期が短く、より短いスパンで資金を管理したい方向けの固定金利タイプです。</li>
          </ul>

          <h2>2. 「変動10年」と「固定5年」の比較</h2>
          <p>個人向け国債の主流である「変動10年」と「固定5年」の違いとはなんでしょうか。</p>
          <ul>
            <li><strong>金利の動き：</strong> 変動10年は金利上昇に合わせて利回りアップ／固定5年は満期（5年）まで金利固定</li>
            <li><strong>最低金利保証：</strong> どちらも年0.05%の最低金利が保証（世の中が超低金利になっても割れ込みません）</li>
            <li><strong>途中解約ルール：</strong> どちらも発行から1年経過すればいつでも中途換金が可能（直前2回分の各利子相当額×0.79685が差引かれます）</li>
          </ul>

          <div class="info-box">
            💡 <strong>中途換金の安心ポイント：</strong><br>
            1年経過すれば国が元本割れなしで買い取ってくれるため、途中で急にお金が必要になった場合でも資産を減らす心配がありません。
          </div>

          <h2>まとめ</h2>
          <p>安全に資金を増やしたい・守りたい場合、今後の金利上昇にも対応できる「変動10年」を選んでおくのも選択肢です。数年以内に使う予定があるお金は「固定5年」を選ぶなど、目的に合わせて上手に使い分けましょう。</p>
        `
      },
      'campaign': {
        tag: 'お得な裏ワザ？',
        title: 'キャンペーン定期預金の「実質的な金利」と見極め方',
        content: `
          <p>ネット銀行などでよく見かける「特別金利キャンペーン 年3.0%！」といった魅惑的な数字。一見すると非常にお得に見えますが、実際に手元に入る利息を計算してみると「思ったより少なかった」と感じることがあります。高金利キャンペーンの裏にある仕組みと、本当のお得度（実質的な金利）を見極めるためのチェックポイントを解説します。</p>

          <h2>1. 「年利」と「預入期間」のカラクリ</h2>
          <p>キャンペーン金利を見るときに最も注意したいのが<strong>「預入期間」</strong>です。銀行が提示する金利は、基本的にすべて「1年間預けた場合」の年利表記となっています。</p>
          <ul>
            <li><strong>1ヶ月ものの特別金利（年3.0%）の場合：</strong> 年3.0%の12分の1（1ヶ月分）の金利しか適用されません。たとえば100万円を預けた場合、1年間の利息30,000円ではなく、1ヶ月分の利息（約2,500円）となります。</li>
            <li><strong>3ヶ月ものの特別金利（年3.0%）の場合：</strong> 年3.0%の4分の1（3ヶ月分）が適用されるため、100万円を預けた場合の実質的な利息は約7,500円です。</li>
          </ul>
          <p>「表記されているパーセンテージ」だけでなく、「その金利が何ヶ月間適用されるのか」を確認することが重要です。</p>

          <h2>2. 税金（20.315%）と実際の「手残り金額」</h2>
          <p>定期預金の利息には、国税や地方税を合わせて<strong>20.315%の税金</strong>がかかります。そのため、計算された受取利息から約2割が自動的に差し引かれます。</p>

          <div class="info-box">
            <strong>【試算例】100万円を「特別金利 年3.0% / 3ヶ月」で預けた場合</strong><br>
            ・額面利息：100万円 × 3.0% × (3/12) ＝ 約7,500円<br>
            ・税金（20.315%）：約1,523円<br>
            ・<strong>実際の受け取り額：約5,977円</strong>
          </div>

          <p>このように、実際に口座へ振り込まれる金額（手残り利息）は税引き後の数字になることを意識して注意しましょう。</p>

          <h2>3. キャンペーン利用時の3つのチェックポイント</h2>
