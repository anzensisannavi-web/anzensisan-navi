<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>記事詳細 - あんぜん資産なび</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Kiwi Maru', sans-serif, serif;
      color: #334155;
      background-color: #f7f9fa;
      background-image: 
        linear-gradient(#e2e8f0 1px, transparent 1px),
        linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      background-size: 24px 24px;
      overflow-x: hidden;
      position: relative;
    }

    .bg-decorations {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }
    .decor-item { position: absolute; opacity: 0.55; }
    .decor-left-1 { top: 150px;  left: 2%;   width: 110px; transform: rotate(-12deg); }
    .decor-left-2 { top: 650px;  left: 3.5%; width: 90px;  transform: rotate(15deg); }
    .decor-left-3 { top: 1200px; left: 1.5%; width: 120px; transform: rotate(-8deg); }
    .decor-right-1 { top: 200px;  right: 2.5%; width: 130px; transform: rotate(8deg); }
    .decor-right-2 { top: 700px;  right: 2%;   width: 100px; transform: rotate(-18deg); }
    .decor-right-3 { top: 1250px; right: 3%;   width: 115px; transform: rotate(12deg); }

    @media (max-width: 1150px) { .bg-decorations { display: none; } }

    .site-wrapper { position: relative; z-index: 1; opacity: 0; animation: fadeInSite 0.6s ease-out 0.5s forwards; }
    @keyframes fadeInSite { to { opacity: 1; } }

    header {
      background-color: #dbeafe;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0; left: 0; width: 100%; z-index: 100;
      border-bottom: 2px dashed #93c5fd;
      transition: transform 0.3s ease;
    }
    header.header-hidden { transform: translateY(-100%); }
    .title-wrapper { position: relative; display: inline-block; padding: 4px 10px; text-decoration: none; cursor: pointer; border-radius: 8px; }
    .tape-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; object-fit: fill;
      filter: drop-shadow(1px 0 0 #ffffff) drop-shadow(-1px 0 0 #ffffff) drop-shadow(0 1px 0 #ffffff) drop-shadow(0 -1px 0 #ffffff) drop-shadow(1px 1px 0 #ffffff) drop-shadow(-1px -1px 0 #ffffff) drop-shadow(0px 2px 4px rgba(0,0,0,0.1));
    }
    .clip-img { position: absolute; top: -10px; left: 20px; width: 20px; z-index: 3; }
    .site-title {
      position: relative; z-index: 2; margin: 0; font-size: 1.25rem; font-weight: 700; color: #ffffff;
      text-shadow: 2px 2px 3px rgba(30, 41, 59, 0.6), -1px -1px 0px rgba(148, 163, 184, 0.4); letter-spacing: 0.05em;
    }
    .menu-btn {
      background: #ffffff; border: 2px solid #64748b; border-radius: 8px; padding: 6px 12px;
      font-family: inherit; font-size: 0.85rem; font-weight: bold; color: #334155; cursor: pointer;
      box-shadow: 2px 2px 0px #64748b; display: flex; align-items: center; gap: 4px;
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      header { padding: 12px 25px; }
      .title-wrapper { padding: 6px 20px; }
      .clip-img { top: -12px; left: 28px; width: 24px; }
      .site-title { font-size: 1.5rem; }
      .menu-btn { padding: 8px 14px; font-size: 0.9rem; gap: 6px; }
    }

    .back-to-top {
      position: fixed; bottom: 25px; right: 20px; background: #60a5fa; color: #fff;
      border: 2px solid #2563eb; padding: 10px 16px; border-radius: 25px; cursor: pointer;
      font-family: inherit; font-weight: bold; box-shadow: 2px 3px 8px rgba(0,0,0,0.15); z-index: 100;
    }

    .page-layout { max-width: 1050px; margin: 0 auto; padding: 90px 15px 40px 15px; display: flex; gap: 25px; align-items: flex-start; }
    .main-content { flex: 1; min-width: 0; text-align: left; }
    .sidebar { width: 270px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; }
    .sub-caption { font-size: 0.85rem; color: #64748b; margin: 10px 0 20px 0; text-align: center; }

    .mono-container {
      background: #ffffff; border: 2px solid #334155; border-radius: 16px; padding: 28px 24px; box-shadow: 3px 3px 0px #cbd5e1; margin-bottom: 30px;
    }

    .article-header { border-bottom: 2px dashed #cbd5e1; padding-bottom: 16px; margin-bottom: 24px; }
    .article-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .article-date { font-size: 0.8rem; color: #64748b; font-weight: bold; }
    .article-category { font-size: 0.72rem; background-color: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 2px 8px; border-radius: 4px; }
    .article-title { font-size: 1.4rem; font-weight: bold; color: #0f172a; margin: 0; line-height: 1.4; }

    .article-body { font-size: 0.92rem; color: #334155; line-height: 1.8; }
    .article-body h2 { font-size: 1.15rem; color: #0f172a; border-left: 4px solid #1e293b; padding-left: 10px; margin: 25px 0 12px 0; }
    .article-body p { margin-bottom: 16px; }

    .back-btn-wrapper { margin-top: 40px; text-align: center; display: flex; justify-content: center; gap: 15px; }
    .btn-nav {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background-color: #ffffff; color: #334155; border: 2px solid #52637a; border-radius: 30px; padding: 10px 24px;
      font-family: inherit; font-size: 0.88rem; font-weight: 700; text-decoration: none; box-shadow: 2px 2px 0px #52637a;
    }

    .sidebar-widget { background: #ffffff; border: 2px solid #334155; border-radius: 12px; padding: 14px 12px; box-shadow: 2px 2px 0px #334155; text-align: left; }
    .widget-title { font-size: 0.85rem; font-weight: bold; color: #1e293b; margin: 0 0 10px 0; padding-bottom: 6px; border-bottom: 1.5px dashed #94a3b8; display: flex; align-items: center; gap: 6px; }
    .widget-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
    .widget-list li { display: flex; align-items: flex-start; gap: 6px; }
    .widget-list li span { flex-shrink: 0; font-size: 0.8rem; line-height: 1.3; }
    .widget-list li a { color: #1d4ed8; text-decoration: none; font-size: 0.75rem; font-weight: bold; line-height: 1.3; word-break: break-all; }
    .widget-list li a:hover { text-decoration: underline; }

    /* 注目キャンペーン用のスタイル（top.htmlと共通化） */
    .campaign-item {
      background-color: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .campaign-item:last-child { margin-bottom: 0; }
    .campaign-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .campaign-badge { background-color: #dc2626; color: #ffffff; font-size: 0.65rem; font-weight: bold; padding: 1px 4px; border-radius: 4px; }
    .campaign-bank { font-size: 0.75rem; font-weight: bold; color: #334155; }
    .campaign-product { font-size: 0.8rem; font-weight: bold; color: #1e293b; margin-bottom: 2px; }
    .campaign-rate { font-size: 0.95rem; font-weight: bold; color: #dc2626; margin-bottom: 2px; }
    .campaign-note { font-size: 0.68rem; color: #64748b; }

    @media (max-width: 850px) { .page-layout { flex-direction: column; } .sidebar { width: 100%; } }

    footer { position: relative; z-index: 1; background-color: #f5ebe0; border-top: 2px dashed #d5bdaf; padding: 30px 15px 20px 15px; text-align: center; }
    .footer-nav { display: flex; flex-direction: column; gap: 14px; margin-bottom: 25px; font-size: 0.9rem; }
    .footer-nav a { color: #475569; text-decoration: none; }
    .copyright { font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="bg-decorations">
    <img src="images/rakugaki-01.png" class="decor-item decor-left-1" alt="">
    <img src="images/rakugaki-02.png" class="decor-item decor-left-2" alt="">
    <img src="images/rakugaki-01.png" class="decor-item decor-left-3" alt="">
    <img src="images/rakugaki-02.png" class="decor-item decor-right-1" alt="">
    <img src="images/rakugaki-01.png" class="decor-item decor-right-2" alt="">
    <img src="images/rakugaki-02.png" class="decor-item decor-right-3" alt="">
  </div>

  <div class="site-wrapper">

    <header id="site-header">
      <a href="top.html" class="title-wrapper">
        <img src="images/clip.png" class="clip-img" alt="" onerror="this.style.display='none'">
        <img src="images/tape.png" class="tape-bg" alt="" onerror="this.style.display='none'">
        <h1 class="site-title">あんぜん資産なび</h1>
      </a>
      <button class="menu-btn"><span>☰</span> メニュー</button>
    </header>

    <button class="back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">▲ トップへ</button>

    <div class="page-layout" id="top">
      <main class="main-content">
        <div class="sub-caption">フラットな目線で資産比較 ー特定サービス斡旋なしー</div>

        <div class="mono-container">
          <div class="article-header">
            <div class="article-meta">
              <span class="article-date" id="post-date">----.--.--</span>
              <span class="article-category" id="post-category">記事</span>
            </div>
            <h1 class="article-title" id="post-title">タイトルを読み込んでいます...</h1>
          </div>

          <div class="article-body" id="post-content">
            <!-- 本文がここに流し込まれます -->
          </div>

          <div class="back-btn-wrapper">
            <a href="articles-list.html" class="btn-nav">📋 記事一覧へ</a>
            <a href="top.html" class="btn-nav">🏠 トップへ戻る</a>
          </div>
        </div>
      </main>

      <!-- サイドバー -->
      <aside class="sidebar">
        <!-- menu.js が自動で「注目キャンペーン」「スポンサーリンク」「失敗しない資産運用の基本」を組み立てます -->
        <div class="sidebar-widget">
          <div class="widget-title">📢 注目キャンペーン</div>
        </div>
        <div class="sidebar-widget">
          <div class="widget-title">📚 失敗しない資産運用の基本</div>
        </div>
      </aside>
    </div>

    <footer>
      <div class="footer-nav">
        <div><a href="top.html">ホーム</a></div>
        <div><a href="tokusho.html">特定商取引法に基づく表記</a></div>
        <div><a href="profile.html">管理人情報</a></div>
      </div>
      <div class="copyright">Copyright 2026 © あんぜん資産なび All Rights Reserved.</div>
    </footer>

  </div>

  <script src="menu.js"></script>
  <script>
    let lastScrollY = window.scrollY;
    const header = document.getElementById('site-header');
    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;
      if (currentScrollY < 10) header.classList.remove('header-hidden');
      else if (currentScrollY > lastScrollY && currentScrollY > 60) header.classList.add('header-hidden');
      else if (currentScrollY < lastScrollY) header.classList.remove('header-hidden');
      lastScrollY = currentScrollY;
    });

    async function loadArticleDetail() {
      const params = new URLSearchParams(window.location.search);
      const articleId = params.get('id');

      try {
        const res = await fetch('articles.json');
        const data = await res.json();
        const target = data.find(item => item.id === articleId) || data[0];

        if (target) {
          document.title = `${target.title} - あんぜん資産なび`;
          document.getElementById('post-title').textContent = target.title;
          document.getElementById('post-date').textContent = target.date || '';
          document.getElementById('post-category').textContent = target.category || '記事';
          document.getElementById('post-content').innerHTML = target.content || `<p>${target.description || ''}</p>`;
        }
      } catch (e) {
        document.getElementById('post-title').textContent = '記事の読み込みに失敗しました';
      }
    }

    document.addEventListener('DOMContentLoaded', loadArticleDetail);
  </script>
</body>
</html>
