<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | あんぜん資産なび</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Kiwi Maru', sans-serif, serif;
      color: #334155;
      background-color: #f7f9fa;
      background-image: 
        linear-gradient(#e2e8f0 1px, transparent 1px),
        linear-gradient(90deg, #e2e8f0 1px, transparent 1px);
      background-size: 24px 24px;
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    header {
      background-color: #dbeafe;
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #93c5fd;
    }

    .title-wrapper {
      position: relative;
      display: inline-block;
      padding: 6px 20px;
      text-decoration: none;
    }

    .site-title {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: 0.05em;
    }

    .container {
      max-width: 750px;
      margin: 40px auto;
      padding: 0 15px;
      width: 100%;
    }

    .content-box {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 2px 2px 0px #e2e8f0;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      border-bottom: 2px dashed #cbd5e1;
      padding-bottom: 12px;
      margin-top: 0;
      color: #1e293b;
      text-align: left;
    }

    p {
      font-size: 0.92rem;
      color: #334155;
      line-height: 1.8;
      margin-bottom: 30px;
      text-align: left;
    }

    /* 白黒の角丸・影付きボタン（共通スタイル） */
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #ffffff;
      border: 2px solid #64748b;
      border-radius: 30px;
      padding: 10px 24px;
      color: #334155;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.92rem;
      text-decoration: none;
      box-shadow: 2px 2px 0px #64748b;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      cursor: pointer;
    }

    .action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 3px 3px 0px #64748b;
    }

    .external-btn-wrapper {
      margin-bottom: 30px;
    }

    .back-btn-wrapper {
      margin-top: 20px;
    }

    footer {
      background-color: #f5ebe0;
      border-top: 2px dashed #d5bdaf;
      padding: 25px 15px;
      text-align: center;
    }

    .footer-nav {
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .footer-nav a {
      color: #475569;
      text-decoration: none;
      margin: 0 8px;
    }

    .copyright {
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <a href="top.html" class="title-wrapper">
      <h1 class="site-title" style="font-size: 1.3rem;">あんぜん資産なび</h1>
    </a>
  </header>

  <div class="container">
    <div class="content-box">
      <h1>お問い合わせ</h1>
      <p>当サイト（あんぜん資産なび）に関するご意見や、掲載内容に関するご連絡は、下記ボタンより専用フォーム（外部ページ）へお進みください。</p>

      <!-- グーグルフォームを開くボタン -->
      <div class="external-btn-wrapper">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSewsVFHNPv08EuuW9SWZmJntQFyan60R2bzhBaYIl1YsJaNPg/viewform" target="_blank" rel="noopener" class="action-btn">
          📝 Googleフォームを開く（別タブ）
        </a>
      </div>

      <!-- ホームへ戻るボタン -->
      <div class="back-btn-wrapper">
        <a href="top.html" class="action-btn">
          ⬅ トップページへ戻る
        </a>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-nav">
      <a href="top.html">ホーム</a> | 
      <a href="tokusho.html">特定商取引法に基づく表記</a> | 
      <a href="profile.html">管理人情報</a> | 
      
    </div>
    <div class="copyright">
      Copyright 2026 © あんぜん資産なび All Rights Reserved.
    </div>
  </footer>

</body>
</html>
